<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Blessed Mazambani — Let's build from here</title>
<desc id="desc">A space-inspired portfolio banner with a glowing coral planet, stars, orbital paths, and a dark central panel.</desc>
<defs>
